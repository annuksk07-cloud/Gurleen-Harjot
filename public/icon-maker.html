<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWA Icon Maker — Gurleen &amp; Harjot Wedding</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #fff8ec;
        color: #3e2430;
        padding: 24px;
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #d4a853;
        border-radius: 14px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      canvas {
        max-width: 160px;
        max-height: 160px;
        border: 1px solid #eee;
        border-radius: 8px;
      }
      a.btn {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: #7a3e55;
        color: #fff8ec;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>PWA Icon Maker (Dev Only)</h1>
    <p id="status">Loading /icons/icon-source.png...</p>
    <div id="grid" class="grid"></div>

    <script>
      const SPECS = [
        { name: 'icon-192.png', size: 192, mode: 'fit' },
        { name: 'icon-512.png', size: 512, mode: 'fit' },
        { name: 'icon-maskable-512.png', size: 512, mode: 'maskable' },
        { name: 'apple-touch-icon.png', size: 180, mode: 'flattened' },
        { name: 'favicon-32.png', size: 32, mode: 'fit' },
      ];

      window.__GENERATED_ICONS__ = {};

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const grid = document.getElementById('grid');
        SPECS.forEach((spec) => {
          const canvas = document.createElement('canvas');
          canvas.width = spec.size;
          canvas.height = spec.size;
          canvas.dataset.iconName = spec.name;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          if (spec.mode === 'maskable' || spec.mode === 'flattened') {
            const grad = ctx.createLinearGradient(0, 0, 0, spec.size);
            grad.addColorStop(0, '#FFF8EC');
            grad.addColorStop(1, '#F8D7DA');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, spec.size, spec.size);
          }

          if (spec.mode === 'maskable') {
            const drawSize = Math.round(spec.size * 0.88);
            const offset = Math.round((spec.size - drawSize) / 2);
            ctx.drawImage(img, offset, offset, drawSize, drawSize);
          } else {
            ctx.drawImage(img, 0, 0, spec.size, spec.size);
          }

          const dataUrl = canvas.toDataURL('image/png');
          window.__GENERATED_ICONS__[spec.name] = dataUrl;

          const card = document.createElement('div');
          card.className = 'card';
          const title = document.createElement('strong');
          title.textContent = `${spec.name} (${spec.size}×${spec.size})`;
          const link = document.createElement('a');
          link.className = 'btn';
          link.href = dataUrl;
          link.download = spec.name;
          link.textContent = `Download ${spec.name}`;

          card.appendChild(title);
          card.appendChild(canvas);
          card.appendChild(link);
          grid.appendChild(card);
        });
        document.getElementById('status').textContent = 'All 5 icons generated from /icons/icon-source.png';
        window.__ICONS_READY__ = true;
      };
      img.onerror = () => {
        document.getElementById('status').textContent = 'Failed to load /icons/icon-source.png';
        window.__ICONS_ERROR__ = true;
      };
      img.src = '/icons/icon-source.png';
    </script>
  </body>
</html>
